name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Ubuntu deliberately: its filesystem is case-sensitive, so an import whose
    # capitalisation does not match the directory on disk fails here and passes
    # on macOS. That class of bug is invisible to anyone developing on a Mac.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest

      - name: Tests
        env:
          MPLBACKEND: Agg  # no display on a runner
        run: python -m pytest tests/ -q

      - name: Scripts run end to end
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/synth.py alpha /tmp/a
          python scripts/alpha.py /tmp/a --sites O1,O2
          python scripts/synth.py ssvep /tmp/s --stim-freq 12
          python scripts/ssvep.py /tmp/s --stim-freq 12 --sites O1,O2 --control Fpz
          python scripts/synth.py cmrr /tmp/c
          python scripts/cmrr.py /tmp/c --monitor Mod_9234/ai0 --fs 2000

      - name: Figures were written
        run: |
          test -f /tmp/a/alpha_reactivity.png
          test -f /tmp/s/ssvep_response.png
          test -f /tmp/c/cmrr_vs_frequency.png
